<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SMMH Hala Tuju</title>
    <script type="text/javascript">
      // Clean redirect to root of GitHub Pages repository
      var segmentCount = 1;
      var loc = window.location;
      var pathParts = loc.pathname.split('/').filter(Boolean);
      var repoName = pathParts.length > 0 ? '/' + pathParts[0] + '/' : '/';
      window.location.replace(loc.protocol + '//' + loc.host + repoName);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./">SMMH Hala Tuju</a>...</p>
  </body>
</html>
